<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <script>
        document.documentElement.classList.add('js');

        (() => {
            try {
                const savedTheme = localStorage.getItem('portfolio-theme-preference');
                const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'auto';

                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
            } catch {
                // If storage is unavailable, fall back to the CSS default without breaking load.
            }
        })();
    </script>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="global.css" />
